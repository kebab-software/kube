name: Build Kube
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: ''
      android_version_code:
        type: string
        default: '1'
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Web and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set release version
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node scripts/prepare-release.mjs "$RELEASE_VERSION"
      - run: npm run check
      - run: node scripts/standalone-web.mjs
      - uses: actions/upload-artifact@v7
        if: inputs.release_version == ''
        with:
          path: dist/Kube-v*.html
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.release_version != ''
        with:
          name: kube-web
          path: dist/
          if-no-files-found: error
          retention-days: 14
  android:
    name: Android APK
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Prepare signed release
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          KEYSTORE_BASE64: ${{ secrets.KUBE_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KUBE_ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Configure KUBE_ANDROID_KEYSTORE_BASE64 first'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Configure KUBE_ANDROID_KEYSTORE_PASSWORD first'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kube-release.jks"
          chmod 600 "$RUNNER_TEMP/kube-release.jks"
          node scripts/prepare-release.mjs "$RELEASE_VERSION"
      - run: chmod +x android/gradlew
      - name: Build debug APK
        if: inputs.release_version == ''
        run: npm run build:android
      - name: Build signed APK and bundle
        if: inputs.release_version != ''
        env:
          KUBE_VERSION: ${{ inputs.release_version }}
          KUBE_ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
          KUBE_RELEASE_BUILD: 'true'
          KUBE_KEYSTORE_PATH: ${{ runner.temp }}/kube-release.jks
          KUBE_KEYSTORE_PASSWORD: ${{ secrets.KUBE_ANDROID_KEYSTORE_PASSWORD }}
        run: npm run build:android:release
      - name: Remove signing key from runner
        if: always() && inputs.release_version != ''
        shell: bash
        run: rm -f "$RUNNER_TEMP/kube-release.jks"
      - uses: actions/upload-artifact@v7
        if: inputs.release_version == ''
        with:
          archive: false
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.release_version != ''
        with:
          name: kube-android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
  desktop:
    name: Desktop (${{ matrix.os }})
    needs: web
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set desktop release version
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          CSC_LINK: ${{ (matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK) || (matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK) || '' }}
        shell: bash
        run: node scripts/prepare-release.mjs "$RELEASE_VERSION"
      - name: Build desktop installer
        shell: bash
        run: |
          # electron-builder treats an empty CSC_LINK as a certificate path.
          for variable in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!variable}" ]; then unset "$variable"; fi
          done
          npm run build:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.release_version != '' && secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ inputs.release_version != '' && ((matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK) || (matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK)) || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.release_version != '' && ((matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD) || (matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD)) || '' }}
          APPLE_ID: ${{ inputs.release_version != '' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.release_version != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.release_version != '' && secrets.APPLE_TEAM_ID || '' }}
      - uses: actions/upload-artifact@v7
        if: inputs.release_version == ''
        with:
          archive: false
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
      - uses: actions/upload-artifact@v4
        if: inputs.release_version != ''
        with:
          name: kube-desktop-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.blockmap
            release/latest*.yml
