name: Publish app release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable version tag, e.g. v0.2.0; an existing release is required for upload
        required: true
        default: v0.2.0
        type: string
      dry_run:
        description: Build and verify release installers without publishing or changing a release
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: app-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            const { releaseVersion } = require('./scripts/release-version.cjs');
            const { version, versionCode } = releaseVersion(process.env.RELEASE_TAG);
            if (process.env.DRY_RUN !== 'true') {
              const tag = await github.rest.repos.getCommit({ ...context.repo, ref: process.env.RELEASE_TAG });
              if (tag.data.sha !== context.sha) throw new Error('Run this workflow from the release tag so uploaded binaries match its commit.');
            }
            core.setOutput('version', version);
            core.setOutput('code', String(versionCode));
            await core.summary.addHeading(`Kube ${version}`).addRaw(`Android version code: ${versionCode}. All artifacts are rebuilt from this workflow's commit.\n`).write();
  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      release_version: ${{ needs.version.outputs.version }}
      android_version_code: ${{ needs.version.outputs.code }}
    secrets: inherit
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: kube-*
          path: build-artifacts
      - name: Prepare update feeds and checksums
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: node scripts/package-release.mjs
      - name: Attach installers, then publish update feeds
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft --jq 'if .isDraft then error("Publish the release first") else true end'
          for file in release-assets/*; do
            case "$file" in *latest*.yml|*/android-update.json|*/tauri-update.json) continue ;; esac
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done
          gh release upload "$RELEASE_TAG" release-assets/latest*.yml release-assets/android-update.json release-assets/tauri-update.json --clobber
          node scripts/release-downloads.mjs
      - name: Save dry-run release package
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
